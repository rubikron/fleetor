# How a pane's `claude` is launched.
#
# Format: `key = value`, one per line, grouped under `[section]` headers.
# `#` starts a comment. Values are taken literally — no quotes, no escapes.
#
# Copy this file to ~/.fleetor/prompts/launch.conf to override it without a
# rebuild. Only the keys you set are overridden; anything you leave out keeps
# the value below. A key that is not recognised is reported on the Activity
# feed and ignored, so a typo cannot silently change how a pane starts.

[worker]

# The model in every worker seat, passed as ANTHROPIC_MODEL.
model = deepseek-v4-flash

# The Anthropic-compatible endpoint the workers talk to, passed as
# ANTHROPIC_BASE_URL. The credential is never configured here — it is read from
# DEEPSEEK_API_KEY in the environment or the nearest .env, and set as
# ANTHROPIC_AUTH_TOKEN. Putting a key in this file would put it in the repo.
base_url = https://api.deepseek.com/anthropic

# Passed as `--permission-mode`. The `claude` default is `manual`, which wedges
# a worker on its first tool call with nobody watching to approve it — there is
# no human on a worker pane. Change this only if you are also watching them.
permission_mode = auto


[fence]

# The Fence (WP-08) narrows what a worker can reach *by name*: its own private
# HOME instead of the operator's real one, and a PATH without the operator's own
# tool rungs. `open` is the only posture that exists — it reproduces today's
# behavior apart from that private HOME, and adds no deny rules. A Posture
# Ladder with other values was proposed and rejected upstream (see
# `decisions.md`); this key is here so a future one has somewhere to land
# without a new setting surface, not because there is a second value to pick
# today. Any other value is refused, loudly, and `open` is used instead — a
# posture that silently did nothing would be worse than the setting not
# existing.
posture = open

# The write guardrail (WP-17) refuses any tool call that would WRITE outside the
# pane's own roots. Reading is not restricted at all — a Bash command a hook lets
# through can read anything internally, so a read denylist would be friction
# rather than enforcement, and a read allowlist has to cover every toolchain path
# or it wedges a pane in the way that looks exactly like a healthy one.
#
# Every pane already gets two roots, and they are not configurable:
#
#     its own working directory     a worker's git worktree; orch's target repo
#     ~/.fleetor/_shell             the socket, the worktrees and the pane config
#                                   dirs live there and panes touch them
#
# …minus ~/.fleetor/_shell/pane-config, which is inside the second root and still
# refused: it holds the guardrail's own rules, and no pane edits its own policy.
#
# `allow` adds a root to every pane, on top of those. Repeat the key for more
# than one. Absolute paths only — a relative one would mean a different directory
# in each of the five panes, so it is refused with a warning rather than guessed
# at. `~` is expanded. Nothing is allowed by default.
#
#   allow = /Users/me/shared-scratch
#   allow = ~/datasets
#
# What this does NOT cover, measured rather than assumed
# (`docs/notes/write-guardrail-notes.md`): writes a command does not *name*. The
# hook sees the Bash command string, so `cargo build` writing into ~/.cargo and a
# worker's `git commit` writing objects into the target repo's .git are both
# invisible to it — and must be, because a guardrail that stopped either would
# wedge every worker on `fleet done`'s first step.
#
# There is deliberately no `[fence]` key naming where rustup lives. Where a
# machine's toolchain is is a fact with one right answer, not a policy — and
# rustup's own RUSTUP_HOME/CARGO_HOME, read from the app's environment before it
# starts, already are the escape hatch for an operator who moved theirs (D-069).


# --- not configurable, and why ------------------------------------------------
#
# The rest of what a pane is launched with is fixed in `src-tauri/src/spawn.rs`.
# Each of these silently wedges a pane forever if it is wrong, and the failure
# looks identical to a healthy pane — every `fleet send` reports success into a
# terminal that is sitting on a dialog. They are listed here so this file is a
# complete account of what a pane gets, not so they can be edited.
#
#   FLEETOR_PANE            the pane's own name. Identity is not optional: a
#                           message from nobody cannot be constructed.
#   FLEET_SOCKET            where the `fleet` CLI dials the hub.
#   PATH                    augmented so `claude` and `fleet` resolve even when
#                           the app was launched from a GUI context. Workers get
#                           a reduced version with none of the operator's own
#                           HOME-derived rungs (WP-08) — the orchestrator keeps
#                           today's PATH unchanged, because it is the operator's
#                           own `claude`. Since D-069 a worker's version carries
#                           one rung more, ~/.fleetor/_shell/cargo/bin, holding
#                           eight shims the fleet seeded. It is a rung and not
#                           just the two variables below because neither
#                           /opt/homebrew/bin nor /usr/local/bin holds a `cargo`:
#                           without it a worker gets `cargo: command not found`
#                           before rustup is ever reached.
#   CARGO_HOME              workers only: ~/.fleetor/_shell/cargo, shared by all
#   RUSTUP_HOME             four, alongside ~/.fleetor/_shell/rustup — a mirror
#                           of the operator's toolchains (settings copied, each
#                           toolchain symlinked; 4 KB, not 1.9 GB). Both are the
#                           fleet's own rather than the operator's real ~/.cargo
#                           and ~/.rustup so that whatever a build downloads —
#                           including a whole toolchain a rust-toolchain.toml
#                           pinned, measured at 35,981 files — lands somewhere
#                           `rm -rf ~/.fleetor` reaches (Tier 1.1), and so a
#                           `cargo install` cannot plant a binary on the
#                           operator's own login PATH. Absent, not pointed at
#                           nothing, when the machine has no rustup; the
#                           Activity feed says so once. See D-069 and
#                           `docs/notes/fence-notes.md`.
#   HOME                    workers only: a private dir under
#                           ~/.fleetor/_shell/home/worker-N, seeded with a
#                           gitconfig (WP-08, the Fence). `~/.ssh`, the
#                           operator's real Claude config, and shell profiles
#                           stop resolving *by name* — see `docs/notes/fence-notes.md`
#                           for what that does and does not stop. The
#                           orchestrator keeps the operator's own HOME.
#   TERM / COLORTERM        xterm-256color / truecolor.
#   CLAUDE_CONFIG_DIR       one per pane under ~/.fleetor/_shell/pane-config,
#                           the orchestrator included since WP-14 (D-062) — which
#                           is what gives the write guardrail above somewhere to
#                           install its hook for orch at all. `orch` keeps the
#                           operator's login through CLAUDE_SECURESTORAGE_CONFIG_DIR
#                           and loses their user CLAUDE.md, skills and MCP servers.
#   ANTHROPIC_API_KEY       *removed*. With it set, interactive `claude` blocks
#                           on an api-key approval prompt and never reaches its
#                           input box. Removed rather than unset, because the
#                           pane inherits the operator's environment (L2).
#   ANTHROPIC_DEFAULT_OPUS_MODEL, ANTHROPIC_DEFAULT_SONNET_MODEL
#                           removed for the same reason: they would override the
#                           worker model above.
#   CLAUDE_CODE_CHILD_SESSION
#                           removed. Launching the app from inside a `claude`
#                           session leaks this through the environment inherit
#                           and silently disables transcript saving in every
#                           pane below it.
#
# The orchestrator takes no settings here on purpose. It is the operator's own
# `claude` — their login, their model, their config dir, their permission mode —
# and the fleet overrides only what it must to make it a pane.
