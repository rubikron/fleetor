[package]
name = "fleetor-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# `fleet`, not `fleetor`: this binary is typed by a language model inside a Bash
# tool call, and the briefs (`fleetor_core::brief`) teach it as `fleet`.
[[bin]]
name = "fleet"
path = "src/main.rs"

[dependencies]
fleetor-core = { path = "../fleetor-core" }
fleetor-ipc = { path = "../fleetor-ipc" }
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
