<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2620"/><stop offset="1" stop-color="#17140f"/>
    </linearGradient>

    <!-- One ramp in user space, shared by every stroke, so the trunk and the four
         arms sample a single continuous gradient and no seam appears at a junction.
         Axis is tilted 25° off vertical (same length/centre as a vertical ramp, just
         rotated), so the light end leans to the upper-right and the mark reads as lit
         from that side. -->
    <linearGradient id="ramp" gradientUnits="userSpaceOnUse" x1="379.30" y1="808.58" x2="644.70" y2="239.42">
      <stop offset="0"   stop-color="#a83f1e"/>
      <stop offset=".38" stop-color="#d6672f"/>
      <stop offset=".76" stop-color="#ef9a4e"/>
      <stop offset="1"   stop-color="#ffbe72"/>
    </linearGradient>

    <g id="mark" fill="none" stroke-linecap="round">
      <path d="M512 611 C512 465, 268 380, 268 226" stroke-width="84"/>
      <path d="M512 611 C512 465, 428 356, 428 226" stroke-width="84"/>
      <path d="M512 611 C512 465, 596 356, 596 226" stroke-width="84"/>
      <path d="M512 611 C512 465, 756 380, 756 226" stroke-width="84"/>
      <path d="M512 822 L512 572" stroke-width="96"/>
      <!-- Fillet. The two inner arms leave the same origin, so their inner edges close
           to a mathematically sharp point at (512, 405.56), meeting at 37.4° — the dimple.
           This fills the wedge below an r=17.65 arc that is tangent to both edges at
           (495.28, 356.23) and (528.72, 356.23), so the valley floor leaves each arm at
           zero angle and reads as one continuous curve. The straight sides run down to
           y=436, well inside the solid trunk, purely to close the path. -->
      <path d="M495.28 356.23 A17.65 17.65 0 0 0 528.72 356.23 L528.72 436 L495.28 436 Z"
            fill="url(#ramp)" stroke="none"/>
    </g>

    <!-- Halo: blur the GRAPHIC, not a flood. The blurred copy carries the ramp with it,
         so every point of the glow is tinted by the source pixels nearest it — amber by
         the tips, ember by the root — and fades out with distance. A flood-and-composite
         glow paints one flat colour and ends at a visible edge; this does not.
         sigma 14 with the blurred copy dropped to 40% alpha keeps the halo a soft
         ambient presence felt over the tile, so the sharp mark on top stays the subject. -->
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b0"/>
      <feComponentTransfer in="b0" result="b"><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Extra reach for the dark end. The ember at the root is dim, so at a shared sigma
         its glow dies sooner than the amber at the tips. This second, wider glow is laid
         underneath and masked to the lower half, buying the dark colours more distance
         without touching their hue. Blur only — the mark itself is drawn by the layer above. -->
    <filter id="glowWide" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="26"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    </filter>
    <linearGradient id="lowerFade" gradientUnits="userSpaceOnUse" x1="512" y1="900" x2="512" y2="500">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="lowerOnly" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="url(#lowerFade)"/>
    </mask>

    <!-- keeps the tail from hazing the transparent corners outside the squircle -->
    <clipPath id="clipTile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>

  <g clip-path="url(#clipTile)">
    <g mask="url(#lowerOnly)">
      <g filter="url(#glowWide)" stroke="url(#ramp)"><use href="#mark"/></g>
    </g>
    <g filter="url(#glow)" stroke="url(#ramp)"><use href="#mark"/></g>
  </g>
</svg>
