[package]
name = "fleetor-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fleetor-core = { path = "../fleetor-core" }
fleetor-cc = { path = "../fleetor-cc" }
fleetor-ipc = { path = "../fleetor-ipc" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
# Phase 4f: signal a worker's process to interrupt an in-flight turn (unix kill(2)).
libc = "0.2"

[dev-dependencies]
fleetor-db = { path = "../fleetor-db" }
tokio = { workspace = true, features = ["test-util"] }
